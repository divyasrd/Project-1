<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111d">
  <meta name="description" content="A small gallery of colorful abstract moments.">
  <title>Gallery — Hi, I am Divya!</title>
  <style>
    :root { color-scheme: dark; --ink: #f5f3ff; --muted: #aaa8bd; --violet: #a78bfa; --mint: #7cf3cf; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 6rem 1.5rem 2rem; color: var(--ink); background: radial-gradient(ellipse at 18% 15%, #49338b55 0, transparent 42%), radial-gradient(ellipse at 85% 78%, #17685844 0, transparent 38%), #10111d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .site-nav { position: fixed; z-index: 2; top: 1.25rem; left: 50%; display: flex; gap: .35rem; padding: .4rem; border: 1px solid #ffffff18; border-radius: 999px; background: #171725bb; backdrop-filter: blur(14px); transform: translateX(-50%); }
    .site-nav a { padding: .65rem .95rem; border-radius: 999px; color: var(--muted); font-size: .85rem; font-weight: 650; text-decoration: none; transition: color .2s ease, background .2s ease; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--ink); background: #ffffff12; }
    .site-nav a:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    main { width: min(100%, 1040px); margin: 0 auto; padding: clamp(2rem, 6vw, 4rem); border: 1px solid #ffffff18; border-radius: 28px; background: linear-gradient(145deg, #ffffff0c, #ffffff04); box-shadow: 0 30px 100px #0005, inset 0 1px #ffffff12; backdrop-filter: blur(14px); animation: rise .8s cubic-bezier(.2,.75,.25,1) both; }
    .eyebrow { margin: 0 0 1rem; color: var(--mint); font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 9vw, 6rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { color: transparent; background: linear-gradient(100deg, var(--violet) 12%, #e8b5ff 52%, var(--mint) 94%); background-clip: text; -webkit-background-clip: text; }
    .intro { max-width: 520px; margin: 1.3rem 0 2.5rem; color: var(--muted); font-size: 1.08rem; line-height: 1.75; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    figure { margin: 0; overflow: hidden; border: 1px solid #ffffff18; border-radius: 18px; background: #ffffff08; transition: transform .25s ease, border-color .25s ease; }
    figure:hover { transform: translateY(-5px); border-color: #a78bfa77; }
    .art { display: grid; aspect-ratio: 1.25; place-items: center; overflow: hidden; font-size: clamp(3rem, 8vw, 6rem); }
    .art-one { background: radial-gradient(circle at 35% 35%, #f8b6ff 0 5%, transparent 6%), radial-gradient(circle at 55% 60%, #a78bfa 0 22%, transparent 23%), linear-gradient(135deg, #33245e, #151724); }
    .art-two { background: radial-gradient(ellipse at 70% 35%, #7cf3cfaa 0 12%, transparent 13%), radial-gradient(ellipse at 30% 75%, #3e9b85 0 25%, transparent 26%), linear-gradient(145deg, #133a3a, #171725); }
    .art-three { background: radial-gradient(circle at 50% 48%, #ffe1a6 0 8%, transparent 9%), conic-gradient(from 35deg at 50% 50%, #f28a9d, #805dd3, #63cdb5, #f2b36e, #f28a9d); }
    .art-four { background: repeating-linear-gradient(135deg, #a78bfa 0 2px, transparent 2px 18px), linear-gradient(35deg, #28224a, #151724); }
    .art-five { background: radial-gradient(ellipse at 50% 115%, #7cf3cf 0 22%, transparent 23%), radial-gradient(ellipse at 50% -15%, #a78bfa 0 24%, transparent 25%), #1b2130; }
    .art-six { background: radial-gradient(circle at 30% 30%, #ffd1f0 0 3%, transparent 4%), radial-gradient(circle at 70% 60%, #7cf3cf 0 4%, transparent 5%), radial-gradient(circle at 45% 75%, #a78bfa 0 3%, transparent 4%), linear-gradient(145deg, #252044, #10111d); }
    figcaption { padding: 1rem 1.1rem 1.15rem; color: #dedbed; font-size: .9rem; font-weight: 600; }
    .footer { margin: 2.5rem 0 0; color: #77758c; font-size: .75rem; letter-spacing: .06em; text-align: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 430px) { body { padding-inline: .8rem; } main { padding: 1.5rem; } .grid { gap: .65rem; } figcaption { padding: .8rem; font-size: .8rem; } .site-nav { gap: 0; } .site-nav a { padding: .6rem .7rem; font-size: .78rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="gallery.html" aria-current="page">Gallery</a>
  </nav>
  <main>
    <p class="eyebrow">A collection of little moments</p>
    <h1>Color me <span>curious.</span></h1>
    <p class="intro">A playful gallery of gradients, shapes, and tiny bursts of color. More pieces can find a home here as the journey unfolds.</p>
    <section class="grid" aria-label="Abstract color gallery">
      <figure><div class="art art-one" role="img" aria-label="Violet orbit with a bright pink spark"></div><figcaption>Violet orbit</figcaption></figure>
      <figure><div class="art art-two" role="img" aria-label="Soft mint shapes on a deep green background"></div><figcaption>Quiet growth</figcaption></figure>
      <figure><div class="art art-three" role="img" aria-label="Warm sunset colors blending together"></div><figcaption>Golden hour</figcaption></figure>
      <figure><div class="art art-four" role="img" aria-label="Fine violet lines crossing diagonally"></div><figcaption>New patterns</figcaption></figure>
      <figure><div class="art art-five" role="img" aria-label="Two glowing forms meeting in the middle"></div><figcaption>In good company</figcaption></figure>
      <figure><div class="art art-six" role="img" aria-label="A dark sky scattered with colorful stars"></div><figcaption>Little universe</figcaption></figure>
    </section>
    <p class="footer">MADE OF CURIOSITY &amp; A FEW LINES OF CODE</p>
  </main>
</body>
</html>
