<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111d">
  <meta name="description" content="Say hello to Divya.">
  <title>Contact US— Hi, I am Divya!</title>
  <style>
    :root { color-scheme: dark; --ink: #f5f3ff; --muted: #aaa8bd; --violet: #a78bfa; --mint: #7cf3cf; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 6rem 1.5rem 2rem; color: var(--ink); background: radial-gradient(ellipse at 18% 15%, #49338b55 0, transparent 42%), radial-gradient(ellipse at 85% 78%, #17685844 0, transparent 38%), #10111d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .site-nav { position: fixed; z-index: 2; top: 1.25rem; left: 50%; display: flex; gap: .35rem; padding: .4rem; border: 1px solid #ffffff18; border-radius: 999px; background: #171725bb; backdrop-filter: blur(14px); transform: translateX(-50%); }
    .site-nav a { padding: .65rem .95rem; border-radius: 999px; color: var(--muted); font-size: .85rem; font-weight: 650; text-decoration: none; transition: color .2s ease, background .2s ease; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--ink); background: #ffffff12; }
    .site-nav a:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    main { width: min(100%, 760px); padding: clamp(2rem, 7vw, 5.5rem); border: 1px solid #ffffff18; border-radius: 28px; background: linear-gradient(145deg, #ffffff0c, #ffffff04); box-shadow: 0 30px 100px #0005, inset 0 1px #ffffff12; text-align: center; backdrop-filter: blur(14px); animation: rise .8s cubic-bezier(.2,.75,.25,1) both; }
    .sparkle { display: inline-grid; width: 58px; height: 58px; margin-bottom: 1.5rem; place-items: center; border: 1px solid #a78bfa55; border-radius: 18px; color: var(--mint); background: #a78bfa18; font-size: 1.7rem; box-shadow: 0 0 40px #a78bfa22; }
    .eyebrow { margin: 0 0 1rem; color: var(--mint); font-size: .72rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 9vw, 6rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { display: block; color: transparent; background: linear-gradient(100deg, var(--violet) 12%, #e8b5ff 52%, var(--mint) 94%); background-clip: text; -webkit-background-clip: text; }
    .intro { max-width: 470px; margin: 1.6rem auto 2rem; color: var(--muted); font-size: 1.08rem; line-height: 1.75; }
    .email-link { display: inline-flex; align-items: center; gap: .7rem; padding: .95rem 1.25rem; border-radius: 999px; color: #141321; background: linear-gradient(100deg, #c5b3ff, #a5ffe2); font-size: .95rem; font-weight: 750; text-decoration: none; box-shadow: 0 8px 30px #9c86ff33; transition: transform .2s ease, box-shadow .2s ease; }
    .email-link:hover { transform: translateY(-3px); box-shadow: 0 12px 36px #9c86ff55; }
    .email-link:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .hint { margin: 1.2rem 0 0; color: #77758c; font-size: .85rem; }
    .footer { margin: 2.5rem 0 0; color: #77758c; font-size: .75rem; letter-spacing: .06em; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <div class="sparkle" aria-hidden="true">✉</div>
    <p class="eyebrow">A note is always welcome</p>
    <h1>Let’s <span>connect.</span></h1>
    <p class="intro">Have an idea, a question, or just want to say hello? I’d love to hear from you.</p>
    <a class="email-link" href="mailto:hello@example.com"><span aria-hidden="true">✧</span> Email me</a>
    <p class="hint">Replace hello@example.com with your email address to receive messages.</p>
    <p class="footer">MADE OF CURIOSITY &amp; A FEW LINES OF CODE</p>
  </main>
</body>
</html>
